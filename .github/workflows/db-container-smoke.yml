# Proves the self-hosted runner can run a throwaway SQL Server 2022 container, deploy the
# sandbox SQL into it with sqlcmd, run the missing-reference check and always remove it.
#   gh workflow run db-container-smoke.yml --ref <branch> -f label=angel
# Until this file is on main, dispatch is unavailable, so a push to the branches below runs it.
# Forks can't push here, so no fork code reaches the self-hosted runner.
name: DB container smoke test

on:
  workflow_dispatch:
    inputs:
      label:
        description: Extra runner label the job is pinned to
        required: true
        default: angel
  push:
    branches: [ci/db-container-smoke, 'test/db-container-smoke-*']

permissions:
  contents: read

concurrency:
  group: db-container-smoke-${{ inputs.label || 'angel' }}

jobs:
  db:
    runs-on: [self-hosted, windows, x64, "${{ inputs.label || 'angel' }}"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: Database

      # Container name, port and sa password are per run, so runs on one machine don't collide.
      # The runner has no pwsh, so the container steps use Windows PowerShell 5.1 (with Bypass, as
      # the machine blocks scripts) and Add-Content -Encoding utf8, because >> writes UTF-16 in 5.1.
      # The runner has no sqlcmd either, so sqlcmd runs inside the container through docker exec.
      - name: Start SQL Server container
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          docker version
          $name = "sandbox-db-${{ github.run_id }}-${{ github.run_attempt }}"
          $password = 'Ci1!' + [guid]::NewGuid().ToString('N')
          Write-Host "::add-mask::$password"
          Add-Content -Path $env:GITHUB_ENV -Value "DB_CONTAINER=$name" -Encoding utf8
          docker run -d --name $name -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$password" `
            -p 127.0.0.1::1433 mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $server = "127.0.0.1," + (docker port $name 1433 | Select-Object -First 1).Split(':')[-1]
          Add-Content -Path $env:GITHUB_ENV -Value "DB_SERVER=$server" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "DB_SA_PASSWORD=$password" -Encoding utf8
          # In 5.1, stderr from a native command stops the script even with *> $null.
          $ErrorActionPreference = 'Continue'
          for ($i = 0; $i -lt 60; $i++) {
            docker exec $name /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $password -N -C -l 2 -Q "SELECT 1" *> $null
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 2
          }
          throw "SQL Server did not accept connections within 120 seconds."

      - name: Deploy and check
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Continue'
          function Invoke-ContainerSqlcmd {
            docker exec $env:DB_CONTAINER /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $env:DB_SA_PASSWORD -N -C -b @args
          }
          # Copied rather than mounted: docker cp needs no file sharing between Windows and the engine.
          docker cp Database "$($env:DB_CONTAINER):/sql"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker exec $env:DB_CONTAINER /opt/mssql-tools18/bin/sqlcmd -? | Select-Object -First 1
          Invoke-ContainerSqlcmd -Q "CREATE DATABASE SandboxDb"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(foreach ($dir in 'Tables', 'Procedures') {
                     Get-ChildItem "Database/$dir/*.sql" | Sort-Object Name | ForEach-Object { "/sql/$dir/$($_.Name)" }
                   }) + '/sql/CI/Check-MissingReferences.sql'
          foreach ($f in $files) {
            Write-Host "== $f"
            Invoke-ContainerSqlcmd -d SandboxDb -i $f
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Remove SQL Server container
        if: always() && env.DB_CONTAINER != ''
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: docker rm -f $env:DB_CONTAINER

      - name: Prune the work folder
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: git clean -xdfq
